[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-markdown"
version = "1.0.0"
authors = [
  { name="xair330" },
]
description = "High-performance PDF to structured Markdown converter with adaptive TOC bookmark partitioning and physical page anchors."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pymupdf>=1.23.0",
]

[project.urls]
"Homepage" = "https://github.com/xair330/pdf-to-markdown"
"Bug Tracker" = "https://github.com/xair330/pdf-to-markdown/issues"

[project.scripts]
pdf-to-markdown = "pdf_to_markdown.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_to_markdown*"]
